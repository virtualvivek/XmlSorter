
name: Build Android XML Sorter

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build standalone EXE
        run: |
          pyinstaller --clean --onefile --console --name AndroidXmlSorter android_xml_sorter.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: AndroidXmlSorter-Windows-x64
          path: dist/AndroidXmlSorter.exe
